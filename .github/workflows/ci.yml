name: Extension builder

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: compute
        run: |
          base_version=$(cat product.version)
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::product.version must contain a three-part numeric version."
            exit 1
          fi
          echo "version=$base_version.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: sm${{ matrix.sm.label }}-${{ matrix.target.os_name }} (x86 and x64)
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        sm:
          - label: '1.12'
            branch: 1.12-dev
          - label: '1.13'
            branch: master
        target:
          - os_name: linux
            runner: ubuntu-22.04
            extension: so
          - os_name: windows
            runner: windows-2022
            extension: dll

    env:
      X86_SDKS: css dods hl2dm sdk2013 tf2 l4d l4d2 csgo
      X64_SDKS: css dods hl2dm tf2
      VERSION: ${{ needs.version.outputs.version }}
      SM_BRANCH: ${{ matrix.sm.branch }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang g++-multilib
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"

      - name: Fetch public build dependencies
        run: |
          HL2SDK_ROOT="$RUNNER_TEMP/collisionhook-deps"
          echo "HL2SDK_ROOT=$HL2SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HL2SDK_ROOT"
          git clone --depth 1 https://github.com/alliedmodders/ambuild "$HL2SDK_ROOT/ambuild"
          git clone --depth 1 --branch 1.12-dev https://github.com/alliedmodders/metamod-source "$HL2SDK_ROOT/metamod-source"
          git clone --depth 1 --branch "$SM_BRANCH" https://github.com/alliedmodders/sourcemod "$HL2SDK_ROOT/sourcemod"
          git -C "$HL2SDK_ROOT/sourcemod" submodule update --init --depth 1 -- \
            hl2sdk-manifests public/amtl public/safetyhook sourcepawn

          for sdk in $X86_SDKS; do
            git clone --depth 1 --branch "$sdk" https://github.com/alliedmodders/hl2sdk "$HL2SDK_ROOT/hl2sdk-$sdk"
          done

          python -m pip install "$HL2SDK_ROOT/ambuild"

      - name: Build and package
        run: |
          mkdir build
          cd build
          python ../configure.py --version="$VERSION" --enable-optimize \
            --targets=x86,x86_64 --sdks=all \
            --hl2sdk-root="$HL2SDK_ROOT" --mms-path="$HL2SDK_ROOT/metamod-source" \
            --sm-path="$HL2SDK_ROOT/sourcemod"
          ambuild

          version="$(cat includes/filename_versioning.txt)"
          if [[ "$version" != "$VERSION" ]]; then
            echo "::error::AMBuild version $version differs from the release version $VERSION."
            exit 1
          fi

      - name: Verify package
        env:
          EXTENSION: ${{ matrix.target.extension }}
        working-directory: build/package
        run: |
          require_file() {
            if [[ ! -s "$1" ]]; then
              echo "::error::Missing or empty package file: $1"
              exit 1
            fi
          }

          for sdk in $X86_SDKS; do
            require_file "addons/sourcemod/extensions/collisionhook.ext.2.$sdk.$EXTENSION"
          done
          for sdk in $X64_SDKS; do
            require_file "addons/sourcemod/extensions/x64/collisionhook.ext.2.$sdk.$EXTENSION"
          done
          require_file addons/sourcemod/gamedata/collisionhook.txt
          require_file addons/sourcemod/scripting/include/collisionhook.inc

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: collisionhook-${{ env.VERSION }}-sm${{ matrix.sm.label }}-${{ matrix.target.os_name }}
          path: build/package/
          if-no-files-found: error
          overwrite: true

  release:
    name: Release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    concurrency:
      group: release-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: collisionhook-${{ env.VERSION }}-*

      - name: Assemble release archives
        run: |
          mkdir assets
          for sm in 1.12 1.13; do
            package="collisionhook-$VERSION-sm$sm"
            linux="artifacts/$package-linux"
            windows="artifacts/$package-windows"
            if [[ ! -d "$linux/addons" || ! -d "$windows/addons" ]]; then
              echo "::error::Missing Linux or Windows package for SourceMod $sm."
              exit 1
            fi

            tar -czf "assets/$package-linux.tar.gz" -C "$linux" addons
            (cd "$windows" && python3 -m zipfile -c \
              "$GITHUB_WORKSPACE/assets/$package-windows.zip" addons)
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          assets=()
          for sm in 1.12 1.13; do
            assets+=("assets/collisionhook-$VERSION-sm$sm-linux.tar.gz"
                    "assets/collisionhook-$VERSION-sm$sm-windows.zip")
          done
          expected_names=$(jq -n --args '$ARGS.positional' "${assets[@]##*/}")

          tagged_commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" || true)
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already points to a different commit."
            exit 1
          fi

          # A rerun can reuse a complete release for the same commit.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets > release.json 2>/dev/null; then
            if [[ "$tagged_commit" == "$GITHUB_SHA" ]] && jq -e --argjson expected "$expected_names" \
              '.isDraft == false and (($expected - [.assets[].name]) | length == 0)' \
              release.json > /dev/null; then
              echo "Release $tag already has all archives."
              exit 0
            fi
            echo "::error::Release $tag exists but is not a complete release for this commit."
            exit 1
          fi

          # The Actions token cannot create a tag with workflow files that differ from master.
          if [[ -z "$tagged_commit" ]]; then
            git fetch --no-tags origin "$GITHUB_REF"
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows/; then
              echo "::notice::Skipping $tag because the workflow files on master have changed."
              exit 0
            fi
          fi

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CollisionHook $VERSION" \
            --notes "Automated release built from $GITHUB_SHA. Download the package matching your SourceMod version and server OS."
